[package]
name = "harbor-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Harbor File Pro backend daemon (Rust)"

[build-dependencies]
serde_json = "1"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "multipart", "json", "ws"] }
portable-pty = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = { version = "0.12", features = ["reset"] }
hex = "0.4"
base64 = "0.22"
regex = "1"
libc = "0.2"
chacha20poly1305 = "0.10.1"
totp-rs = { version = "5.7.2", default-features = false }
tar = { version = "0.4.44", default-features = false }
regex-syntax = "0.8"
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "4.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
